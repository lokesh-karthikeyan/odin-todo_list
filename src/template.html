<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TOP | Todo List</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <button class="menu">
          <span class="hamburger"></span>
        </button>
        <h1 class="header__title">Todo List 🗒️</h1>
      </div>
    </header>
    <main class="main">
      <div class="blur-container">
        <div class="section projects">
          <button class="close">❌</button>
          <div class="container">
            <h2 class="section__title">Projects 🗃️</h2>
            <hr class="line">
            <button class="all-todos">All Todo Items</button>
            <hr class="line">
            <div class="projects__list">
            </div>
            <div class="wrapper">
              <button class="create project-button">✚ New Project</button>
            </div>
          </div>
        </div>
      </div>
      <section class="section todo">
        <div class="container">
          <h2 class="section__title">Todo 📝</h2>
          <hr class="line">
          <div class="wrapper">
            <button class="create todo-button">✚ Add Todo</button>
          </div>
          <div class="todo__list">
          </div>
        </div>
      </section>
    </main>
    <div class="modal-container">
      <dialog class="project modal">
        <h2 class="section__title">Projects</h2>
        <hr class="line">
        <form method="dialog" class="form">
          <div class="form-control">
            <label for="project-name" class="label">Name</label>
            <input type="text" id="project-name" placeholder="Enter Project name..." required>
          </div>
          <div class="form-submit">
            <button class="submit submit-button project">Create Project</button>
          </div>
        </form>
      </dialog>
      <dialog class="todo modal">
        <h2 class="section__title">Todo</h2>
        <hr class="line">
        <form method="dialog" class="form">
          <div class="form-control">
            <label for="todo-title" class="label">Title</label>
            <input type="text" id="todo-title" name="title" placeholder="Add title here..." required>
          </div>
          <div class="form-control">
            <label for="todo-description" class="label">Description</label>
            <textarea id="todo-description" name="description" placeholder="Add description here..." required></textarea>
          </div>
          <div class="form-control">
            <label for="todo-dueDate" class="label">Due Date</label>
            <input type="date" id="todo-dueDate" name="dueDate" placeholder="Add title here..." required>
          </div>
          <div class="form-control">
            <label for="todo-priority" class="label">Choose Priority</label>
            <select name="priority" id="todo-priority">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>
          <div class="form-control">
            <label for="todo-project" class="label">Select Project</label>
            <select name="projectId" id="todo-project">
            </select>
          </div>
          <div class="form-submit">
            <button class="submit submit-button todo">Create Todo</button>
          </div>
        </form>
      </dialog>
      <dialog class="edit-todo modal">
        <h2 class="section__title">Todo</h2>
        <hr class="line">
        <form method="dialog" class="form">
          <div class="form-control">
            <label for="todo-edit-title" class="label">Title</label>
            <input type="text" id="todo-edit-title" name="title" placeholder="Add title here..." required>
          </div>
          <div class="form-control">
            <label for="todo-edit-description" class="label">Description</label>
            <textarea id="todo-edit-description" name="description" placeholder="Add description here..." required></textarea>
          </div>
          <div class="form-control">
            <label for="todo-edit-dueDate" class="label">Due Date</label>
            <input type="date" id="todo-edit-dueDate" name="dueDate" placeholder="Add title here..." required>
          </div>
          <div class="form-control">
            <label for="todo-edit-priority" class="label">Choose Priority</label>
            <select name="priority" id="todo-edit-priority">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>
          <div class="form-submit">
            <button class="submit submit-button edit-todo">Update Todo</button>
          </div>
        </form>
      </dialog>
    </div>
    <template class="project-template">
      <div class="project__details">
        <button class="project__name"></button>
        <div class="project__actions">
          <button class="edit-button project">🖍</button>
          <button class="remove-button project">🗑️</button>
        </div>
      </div>
    </template>
    <template class="todo-template">
      <div class="todo__details">
        <div class="todo__item">
          <h2 class="todo__title"></h2>
          <hr class="line">
          <p class="todo__description"></p>
        </div>
        <div class="todo__actions">
          <button class="todo-status"></button>
          <button class="edit-button todo">🖍</button>
          <button class="remove-button todo">🗑️</button>
        </div>
      </div>
    </template>
  </body>
</html>
